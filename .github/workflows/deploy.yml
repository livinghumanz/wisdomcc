name: Deploy Wiscomcc

on:
  push:
    branches:
      - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout repository
              uses: appleboy/ssh-action@v0.1.5
              with:
                host: ${{ secrets.SERVER_HOST }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                port: 22
                script: |
                    set -e

                    cd /home/ubuntu/app

                    # `git pull` aborts whenever upstream history has been rewritten: the
                    # checkout is left on a commit that no longer exists and git refuses to
                    # reconcile diverged branches without a strategy. That is exactly how the
                    # deploy for cb6963f failed. The server should mirror origin/main
                    # exactly, so fetch and hard-reset instead.
                    git fetch origin main
                    git reset --hard origin/main

                    source /home/ubuntu/app/venv/bin/activate

                    # The deploy has never installed dependencies; the first time anything is
                    # added to requirements.txt it would otherwise fail at import time.
                    pip install -r requirements.txt

                    python manage.py collectstatic --noinput
                    python manage.py migrate --noinput

                    # The nginx config lives in this repo but was never installed on the
                    # server, so edits to it had no effect. Install it only if it differs,
                    # and only reload after nginx itself says the config is valid -- a bad
                    # config must not be allowed to take the site down.
                    if ! sudo cmp -s sites-available_slash_wisdomcc /etc/nginx/sites-available/wisdomcc; then
                      sudo cp /etc/nginx/sites-available/wisdomcc /etc/nginx/sites-available/wisdomcc.bak.$(date +%s) || true
                      sudo cp sites-available_slash_wisdomcc /etc/nginx/sites-available/wisdomcc
                      if sudo nginx -t; then
                        echo "nginx config updated"
                      else
                        echo "nginx config invalid - rolling back" >&2
                        sudo cp "$(ls -t /etc/nginx/sites-available/wisdomcc.bak.* | head -1)" /etc/nginx/sites-available/wisdomcc
                        sudo nginx -t
                        exit 1
                      fi
                    fi

                    # Uploaded media must be readable by nginx.
                    mkdir -p /home/ubuntu/app/media
                    chmod -R a+rX /home/ubuntu/app/media

                    sudo systemctl restart gunicorn
                    sudo systemctl reload nginx
